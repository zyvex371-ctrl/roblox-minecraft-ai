<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraft AI | Roblox & Minecraft</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="overlay" class="overlay" onclick="fecharMenu()"></div>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>💬 Histórico</h2>
            <button class="close-btn" onclick="fecharMenu()">✕</button>
        </div>
        
        <button class="new-chat-btn" onclick="novoChat()">➕ Novo Chat</button>
        <button class="brain-btn" onclick="configurarCerebro()">🧠 Configurar Cérebro</button>

        <div id="history-list" class="history-list"></div>
    </div>

    <div class="main-container">
        <header class="chat-header">
            <button class="menu-btn" onclick="abrirMenu()">☰</button>
            <div class="header-title">
                <h1>CodeCraft AI</h1>
                <span>Roblox & Minecraft</span>
            </div>
        </header>

        <div id="chat-box" class="chat-box"></div>

        <div class="input-container">
            <textarea id="user-input" placeholder="Perguntar ao CodeCraft..."></textarea>
            <button id="send-btn" onclick="enviarMensagem()">➤</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraft AI</title>
    <link rel="stylesheet" href="style.css">
    <!-- Biblioteca para estilizar os códigos e textos -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- SIDEBAR (Menu lateral na Direita) -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Meus Chats</h3>
            <button onclick="novoChat()" class="new-chat-btn">+ Novo Chat</button>
            <!-- BOTÃO PARA MEXER NO CÉREBRO DA IA -->
            <button onclick="configurarCerebro()" class="brain-btn">🧠 Cérebro da IA</button>
        </div>
        <div id="history-list" class="history-list">
            <!-- Histórico de chats -->
        </div>
    </div>

    <!-- OVERLAY (Fundo escuro) -->
    <div id="overlay" class="overlay" onclick="fecharMenu()"></div>

    <div class="chat-container">
        <header>
            <div class="header-left">
                <h1>🤖 CodeCraft AI</h1>
                <p>Roblox & Minecraft</p>
            </div>
            <!-- BOTÃO DE 3 TRACINHOS NA PONTA DIREITA -->
            <button id="menu-btn" class="menu-btn" onclick="abrirMenu()">☰</button>
        </header>
        
        <div id="chat-box" class="chat-box">
            <div class="message ai-message">
                Olá! Sou sua IA especialista em sistemas completos para Roblox (Studio / Delta) e Minecraft. Como posso ajudar hoje?
            </div>
        </div>

        <!-- BARRA DE FALA ESTILO CHATGPT -->
        <div class="input-container-wrapper">
            <div class="input-area">
                <button class="plus-btn" title="Mais opções">+</button>
                <input type="text" id="user-input" placeholder="Perguntar ao CodeCraft..." onkeypress="observarEnter(event)">
                <button class="send-btn" onclick="enviarMensagem()">➤</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

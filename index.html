l<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraft AI</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importando a biblioteca que entende os códigos e textos grossos (Markdown) -->
    <script src="[https://cdn.jsdelivr.net/npm/marked/marked.min.js](https://cdn.jsdelivr.net/npm/marked/marked.min.js)"></script>
</head>
<body>
    <div class="chat-container">
        <header>
            <h1>🤖 CodeCraft AI</h1>
            <p>Sua IA para Roblox e Minecraft</p>
        </header>
        
        <div id="chat-box" class="chat-box">
            <div class="message ai-message">
                Olá! Sou sua IA especialista. Quer criar um mod para Minecraft ou um script de Roblox hoje?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Digite sua dúvida aqui...">
            <button onclick="enviarMensagem()">Enviar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
